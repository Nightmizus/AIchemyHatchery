# Aliyun is a TCP gateway. TLS and the application remain on Windows.
# Loopback listeners are reverse forwards maintained by hatchery-cn-tunnel.
user www-data;
worker_processes 2;
worker_rlimit_nofile 8192;
worker_shutdown_timeout 60s;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 2048;
}

stream {
    log_format hatchery_gateway '$remote_addr [$time_local] $protocol $status sent=$bytes_sent received=$bytes_received duration=$session_time upstream=$upstream_addr connect=$upstream_connect_time';
    access_log /var/log/nginx/hatchery-gateway.log hatchery_gateway;
    proxy_connect_timeout 2s;
    proxy_timeout 1h;
    proxy_socket_keepalive on;
    # Retry only a failed connection establishment, never an accepted HTTP job.
    proxy_next_upstream on;
    proxy_next_upstream_tries 2;
    proxy_protocol on;

    upstream hatchery_windows_http {
        zone hatchery_windows_http 64k;
        server 127.0.0.1:28080 max_fails=1 fail_timeout=5s;
        server 100.126.79.100:18080 backup;
    }
    upstream hatchery_windows_https {
        zone hatchery_windows_https 64k;
        server 127.0.0.1:28443 max_fails=1 fail_timeout=5s;
        server 100.126.79.100:18443 backup;
    }

    server {
        listen 80;
        listen [::]:80;
        proxy_pass hatchery_windows_http;
    }
    server {
        listen 443;
        listen [::]:443;
        proxy_pass hatchery_windows_https;
    }
}
