# Aliyun sshd_config.d: a dedicated forwarding-only account.
# The authorized key also uses restrict,port-forwarding and permitlisten options.
Match User hatchery-tunnel
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AllowTcpForwarding remote
    AllowStreamLocalForwarding no
    PermitListen 127.0.0.1:28080 127.0.0.1:28443
    PermitOpen none
    GatewayPorts no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTTY no
    MaxSessions 0
    ClientAliveInterval 15
    ClientAliveCountMax 3
Match all
